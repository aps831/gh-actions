version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: aps831
      ref: v2.4.0
      uri: https://github.com/aps831/trunk-io-plugins
    - id: trunk
      ref: v1.6.0
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - terraform-validate
  enabled:
    - checkov@3.3.10
    - trufflehog@3.78.1
    - trivy@0.52.1
    - yamllint@1.38.0
    - actionlint@1.7.1
    - git-diff-check
    - gitleaks@8.18.3
    - markdownlint@0.49.1
    - prettier@3.9.6
    - shellcheck@0.10.0
    - shfmt@3.6.0
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@18.12.1
actions:
  disabled:
  enabled:
    - wip-check
    - templated-output-check
    - hardcoding-check
    - commitizen-tools-check
    - commitizen-prompt-conventional
    - commit-branch
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
